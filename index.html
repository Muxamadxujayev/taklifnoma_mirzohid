<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To'y taklifnomasi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="kirish" class="kirish">
    <button id="ochishBtn" class="ochish-btn">Taklifnomani ochish</button>
  </div>

  <div class="sahifa">
    <img src="taklifnoma obrazes.png" alt="To'y taklifnomasi" class="taklifnoma-rasm">
  </div>

  <audio id="musiqa" loop>
    <source src="6dfd366b-8b94-4e71-a729-cc97b125a990.mp3" type="audio/mpeg">
  </audio>

  <script>
    const kirish = document.getElementById('kirish');
    const musiqa = document.getElementById('musiqa');
    document.getElementById('ochishBtn').addEventListener('click', () => {
      musiqa.volume = 0.5;
      musiqa.play();
      kirish.classList.add('yopiq');
      setTimeout(() => kirish.style.display = 'none', 600);
    });
  </script>
</body>
</html>
