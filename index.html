<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To'y taklifnomasi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sahifa">
    <img src="taklifnoma obrazes.png" alt="To'y taklifnomasi" class="taklifnoma-rasm">
  </div>

  <audio id="musiqa" loop>
    <source src="6dfd366b-8b94-4e71-a729-cc97b125a990.mp3" type="audio/mpeg">
  </audio>

  <script>
  const musiqa = document.getElementById('musiqa');
  musiqa.volume = 0.5;

  let oxirgiTegish = 0;

  function qoshiqAlmashtir() {
    const hozir = Date.now();
    // 300 ms ichida ikkinchi tegish bo'lsa — e'tiborsiz qoldiriladi
    if (hozir - oxirgiTegish < 300) return;
    oxirgiTegish = hozir;

    if (musiqa.paused) {
      musiqa.play().catch(() => {});
    } else {
      musiqa.pause();
    }
  }

  document.body.addEventListener('click', qoshiqAlmashtir);
  document.body.addEventListener('touchstart', qoshiqAlmashtir);
  </script>
</body>
</html>
