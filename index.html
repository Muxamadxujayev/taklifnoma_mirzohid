<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To'y taklifnomasi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sahifa">
    <img src="taklifnoma-obrazes.png" alt="To'y taklifnomasi" class="taklifnoma-rasm">
  </div>

  <audio id="musiqa" loop>
    <source src="musiqa.mp3" type="audio/mpeg">
  </audio>

  <script>
    const musiqa = document.getElementById('musiqa');

    // Ekranning istalgan joyiga ilk marta tegilsa — musiqa boshlanadi
    function qoshiqBoshla() {
      if (musiqa.paused) {
        musiqa.volume = 0.5;
        musiqa.play().catch(() => {});
      }
    }

    // Tegish, bosish, klaviatura — hammasi hisobga olinadi
    document.body.addEventListener('click', qoshiqBoshla, { once: true });
    document.body.addEventListener('touchstart', qoshiqBoshla, { once: true });
    document.body.addEventListener('scroll', qoshiqBoshla, { once: true });
    document.body.addEventListener('keydown', qoshiqBoshla, { once: true });
  </script>
</body>
</html>
